name: "Release (anylinux amd64 + manylinux2014 amd64 + macOS arm64)"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      draft:
        description: Publish a draft release and leave the `latest` tag alone.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: Silimate/actions/.github/workflows/native-tarball-release.yml@v1
    permissions:
      contents: write
    with:
      product: vcd2fst
      # Only publish from main; pull requests build and smoke-test but release nothing
      publish: ${{ github.event_name != 'pull_request' }}
      draft: ${{ inputs.draft || false }}
      alpine-packages: libdwarf-dev elfutils-dev zlib-dev
      centos-packages: zlib-devel elfutils-devel elfutils-libelf-devel libdwarf-devel
      macos-packages: cmake
      build-script: |
        cmake -DCMAKE_BUILD_TYPE=Release -S . -B build
        cmake --build build -j"$NPROC"
        cp build/vcd2fst "$STAGE/bin/"
      smoke-test: |
        # Extract to a throwaway prefix so the binary can only resolve its
        # libraries through the RPATHs the bundling step set, exactly as a user
        # would after unpacking the archive
        rm -rf /tmp/smoke && mkdir -p /tmp/smoke
        tar xzf "$TARBALL" -C /tmp/smoke
        /tmp/smoke/usr/local/bin/vcd2fst -h > /tmp/smoke/out.log 2>&1 || true
        grep -q "Usage:" /tmp/smoke/out.log
